```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apresentações da Escola</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      width: 100vw;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      id="video"
      src="https://drive.google.com/file/d/1ayFwNiyBrbjhqb5a6_lnT8gpQghrnW9y/preview?autoplay=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <script>

    // =====================================================
    // TEMPO DO VÍDEO
    // 21 minutos e 13 segundos
    // =====================================================

    const duracaoVideo = (21 * 60 + 13) * 1000;


    // =====================================================
    // FUNÇÃO PARA REINICIAR O VÍDEO
    // =====================================================

    function reiniciarVideo() {

      const video = document.getElementById("video");

      console.log("Reiniciando vídeo...");

      video.src =
        "https://drive.google.com/file/d/1ayFwNiyBrbjhqb5a6_lnT8gpQghrnW9y/preview?autoplay=1&loop=1&t="
        + Date.now();

    }


    // =====================================================
    // LOOP INFINITO
    // =====================================================

    function iniciarLoop() {

      setTimeout(function () {

        reiniciarVideo();

        // Inicia novamente o contador
        iniciarLoop();

      }, duracaoVideo);

    }


    // Inicia o loop
    iniciarLoop();

  </script>

</body>
</html>
```
